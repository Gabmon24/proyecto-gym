# Orquestación de Base de Datos Local para Desarrollo
services:
  postgres:
    image: postgres:16-alpine
    container_name: gym_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_local
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
    volumes:
      - gym_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gym_pgdata:
